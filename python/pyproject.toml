[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-py"
version = "0.1.0"
description = "FRONTIER verifiers, worker adapters and analysis"
requires-python = ">=3.11"
dependencies = ["numpy", "jsonschema"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["frontier_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
